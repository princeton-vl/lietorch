[build-system]
# torch is deliberately not listed: it must be the already installed (CUDA/ROCm) build,
# see setup.py. Build with `pip install --no-build-isolation`.
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "lietorch"
version = "0.3" 
description = "Lie Groups for PyTorch"
authors = [
    { name="Zachary Teed", email="zachteed@gmail.com" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.9"
# torch is intentionally not a dependency: pip must not replace your CUDA/ROCm build of PyTorch
dependencies = [
    "numpy",
]
